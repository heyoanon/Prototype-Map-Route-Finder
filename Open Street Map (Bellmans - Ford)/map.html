<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map Search</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Search places and explore map services.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app-icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
    body { color: #202124; background: #fff; }
    #map { width: 100%; height: 100%; }
    .search-panel {
      position: absolute; z-index: 1000; top: 14px; left: 20px; width: min(250px, calc(100vw - 32px));
      max-height: calc(100vh - 32px); overflow-y: auto; padding: 0;
      border-radius: 0; background: transparent; box-shadow: none;
    }
    .search-panel:has(> #location-status.visible, > #status.visible, > #service-details:not([hidden]), > #routes:not(:empty)) {
      border-radius: 20px; background: #fff; box-shadow: 0 2px 10px #0004;
    }
    #search-form {
      display: flex; align-items: center; gap: 4px; padding: 2px 4px 2px 12px;
      border: 1px solid #dadce0; border-radius: 999px; background: #fff;
    }
    .theme-control {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin: 6px 4px 2px; color: #555; font-size: 12px;
    }
    .theme-control select {
      flex: 1; width: 100%; min-width: 0; padding: 5px 7px; border: 1px solid #dadce0;
      border-radius: 4px; background: #fff; color: #202124; font: inherit;
    }
    .account-panel { position: relative; margin: 0; padding: 0; border: 0; }
    .map-tool-button {
      display: grid; place-items: center; width: 46px; height: 46px; padding: 0;
      border: 1px solid #bbb; border-radius: 50%; background: #fff;
      color: #333; cursor: pointer;
    }
    .map-tool-button:hover { background: #f1f3f4; }
    .map-tool-button:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }
    .map-tool-button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .account-content {
      position: absolute; z-index: 1001; top: 52px; right: 0;
      width: min(320px, calc(100vw - 24px)); max-height: min(75vh, 560px);
      overflow-y: auto; margin: 0; padding: 10px; border: 1px solid #dadce0;
      border-radius: 16px; background: #fff; box-shadow: 0 2px 10px #0004;
    }
    .history-panel { position: relative; }
    .history-content {
      position: absolute; z-index: 1001; bottom: 52px; left: 0;
      width: min(340px, calc(100vw - 24px)); max-height: min(75vh, 560px);
      overflow-y: auto; padding: 10px; border: 1px solid #dadce0;
      border-radius: 16px; background: #fff; box-shadow: 0 2px 10px #0004;
    }
    .history-content[hidden], .account-content[hidden] { display: none; }
    #history-status { margin-top: 7px; color: #555; font-size: 12px; line-height: 1.4; }
    #history-logged-out { margin-top: 6px; color: #555; font-size: 12px; line-height: 1.4; }
    .account-content label { display: block; margin-top: 7px; color: #555; font-size: 12px; }
    .account-content input {
      display: block; width: 100%; min-height: 34px; margin-top: 3px; padding: 5px 7px;
      border: 1px solid #dadce0; border-radius: 4px; background: #fff; color: #202124; font: inherit;
    }
    .account-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .account-buttons button, #account-open-form, #clear-history {
      min-height: 32px; padding: 5px 8px; border: 1px solid #dadce0; border-radius: 4px;
      background: #fff; color: #1a73e8; font: inherit; font-size: 12px; cursor: pointer;
    }
    .account-buttons button:disabled, #account-open-form:disabled { color: #777; cursor: not-allowed; }
    #account-status { margin-top: 7px; color: #555; font-size: 12px; line-height: 1.4; }
    #account-identity { color: #202124; font-size: 12px; overflow-wrap: anywhere; }
    .account-history-heading { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .account-history-heading h3 { margin: 0; color: #202124; font-size: 13px; }
    #clear-history { min-height: 28px; padding: 3px 6px; }
    #activity-history { max-height: 180px; overflow-y: auto; margin: 6px 0 0; padding-left: 20px; }
    #activity-history li { padding: 4px 0; color: #333; font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }
    .activity-time { display: block; color: #666; font-size: 10px; }
    #destination {
      flex: 1; min-width: 0; height: 40px; padding: 0 8px; border: 0; outline: 0;
      font-size: 15px; background: transparent;
    }
    #search-button {
      display: grid; place-items: center; width: 40px; height: 40px; border: 0;
      border-radius: 50%; background: #fff; color: #444; cursor: pointer;
    }
    #search-button:hover { background: #f1f3f4; }
    #search-button:disabled { color: #999; cursor: wait; }
    #status { display: none; margin: 4px 8px 2px; color: #555; font-size: 13px; line-height: 1.4; }
    #status.visible { display: block; }
    #location-status { display: none; margin: 4px 8px 2px; color: #555; font-size: 12px; line-height: 1.35; }
    #location-status.visible { display: block; }
    .search-panel > #location-status,
    .search-panel > #status,
    .search-panel > #service-details,
    .search-panel > #routes { margin-left: 10px; margin-right: 10px; }
    #routes { display: grid; gap: 8px; margin-top: 6px; }
    #routes:empty { margin-top: 0; }
    .route-card { overflow: hidden; border: 1px solid #dadce0; border-radius: 6px; background: #fff; }
    .route-card.shortest { border: 2px solid #188038; background: #f4fbf6; }
    .route-card.selected { box-shadow: 0 0 0 2px #1a73e8; }
    .route-card summary {
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      padding: 10px; cursor: pointer; list-style: none;
    }
    .route-card summary::-webkit-details-marker { display: none; }
    .route-name { font-size: 14px; }
    .route-card.shortest .route-name, .route-card.shortest .route-meta { font-weight: 700; }
    .route-meta { flex: 0 0 auto; color: #555; font-size: 12px; text-align: right; }
    .route-directions { padding: 0 10px 10px; border-top: 1px solid #e8eaed; }
    .route-directions ol { margin: 8px 0 0; padding-left: 26px; }
    .route-directions li { padding: 5px 0 5px 2px; color: #333; font-size: 13px; line-height: 1.35; }
    .step-distance { display: block; margin-top: 2px; color: #666; font-size: 11px; }
    .no-directions { margin: 9px 0 0; color: #666; font-size: 13px; }
    .map-categories-control {
      position: relative; border-radius: 6px; background: transparent; transform: translateY(-18px);
    }
    .map-categories-toolbar { display: flex; align-items: flex-start; gap: 6px; }
    .map-categories-toggle { font: inherit; }
    .map-categories-panel {
      position: absolute; bottom: 52px; left: 0; width: min(270px, calc(100vw - 24px));
      max-height: min(75vh, 560px); overflow-y: auto; padding: 10px;
      border-radius: 16px; background: #fff; box-shadow: 0 2px 10px #0004;
    }
    .map-categories-panel[hidden] { display: none; }
    .map-control-section + .map-control-section { margin-top: 10px; padding-top: 8px; border-top: 1px solid #e8eaed; }
    .map-control-heading { margin: 0 0 5px; color: #555; font-size: 12px; font-weight: 700; }
    .map-control-row { display: flex; min-height: 30px; align-items: center; gap: 7px; padding: 3px 4px; color: #202124; font-size: 13px; }
    .map-control-row input { margin: 0; }
    .map-category-main { display: flex; align-items: center; gap: 6px; }
    .map-category-main .map-control-row { flex: 1; font-weight: 600; }
    .map-category-expand {
      width: 28px; height: 28px; border: 0; border-radius: 4px;
      background: transparent; color: #444; font-size: 16px; cursor: pointer;
    }
    .map-category-expand:hover { background: #f1f3f4; }
    .map-category-children { padding-left: 20px; }
    .map-category-children[hidden] { display: none; }
    .leaflet-bottom.leaflet-right .leaflet-control-attribution {
      max-width: min(72vw, 560px); margin: 0 10px 0 0; padding: 3px 7px;
      border-radius: 8px; background: #fffffff0; box-shadow: 0 1px 5px #0002;
      font-size: 9px; line-height: 1.35; text-align: right;
    }
    .leaflet-control-zoom.leaflet-bar {
      display: flex; gap: 6px; border: 0; box-shadow: none;
    }
    .leaflet-control-zoom.leaflet-bar a,
    .leaflet-control-zoom.leaflet-bar a:first-child,
    .leaflet-control-zoom.leaflet-bar a:last-child {
      float: none; width: 46px; height: 46px; line-height: 44px;
      border: 1px solid #bbb; border-radius: 50%; background: #fff;
      color: #333; font-size: 24px; box-shadow: 0 1px 5px #0003;
    }
    @media (max-width: 650px) {
      .map-categories-control { transform: translateY(-30px); }
    }
    @media (max-width: 359px) {
      .map-categories-control { transform: translateY(-42px); }
    }
    .service-div-icon { border: 0; background: transparent; }
    .service-pin { display: flex; align-items: center; gap: 5px; height: 28px; }
    .service-badge {
      display: grid; flex: 0 0 22px; place-items: center; width: 22px; height: 22px;
      border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 14px;
      font-weight: 700; box-shadow: 0 1px 5px #0008;
    }
    .service-name {
      display: none; overflow: hidden; max-width: 210px; padding: 3px 5px;
      border: 1px solid transparent; border-radius: 4px;
      background: transparent; color: #202124; font-size: 12px; font-weight: 600;
      text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 3px #fff, 0 0 5px #fff;
      cursor: pointer;
    }
    .service-pin.expanded .service-name {
      display: inline-block; border-color: var(--service-color);
    }
    #service-details {
      margin-top: 8px; padding: 10px; border: 1px solid #dadce0;
      border-left: 3px solid var(--service-color); border-radius: 6px; background: #fff;
    }
    #service-details[hidden] { display: none; }
    .service-details-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .service-details-title { font-size: 14px; }
    .service-details-category { margin-top: 4px; color: #555; font-size: 13px; }
    .service-details-row { margin-top: 5px; color: #333; font-size: 13px; line-height: 1.35; }
    .service-details-row a { color: #1a73e8; overflow-wrap: anywhere; }
    .service-details-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .service-details-action {
      min-height: 34px; padding: 0 10px; border: 1px solid #dadce0; border-radius: 5px;
      background: #fff; color: #1a73e8; font: inherit; font-size: 13px;
      text-decoration: none; cursor: pointer;
    }
    .service-details-action:hover { background: #f1f3f4; }
    .service-details-action:disabled { color: #777; background: #f8f9fa; cursor: not-allowed; }
    .service-details-action.assistance { border-color: #d93025; color: #d93025; }
    .service-details-hours { font-weight: 700; }
    .service-details-hours.open { color: #188038; }
    .service-details-hours.closed { color: #d93025; }
    .service-details-hours.unknown { color: #666; }
    .service-details-notice {
      margin-top: 8px; color: #666; font-size: 11px; line-height: 1.35;
    }
    :root[data-theme="dark"] body { color: #e8eaed; background: #202124; }
    :root[data-theme="dark"] .route-card,
    :root[data-theme="dark"] .map-categories-toggle,
    :root[data-theme="dark"] .map-categories-panel,
    :root[data-theme="dark"] .account-content,
    :root[data-theme="dark"] .history-content,
    :root[data-theme="dark"] .map-tool-button,
    :root[data-theme="dark"] #search-form,
    :root[data-theme="dark"] #service-details,
    :root[data-theme="dark"] .service-details-action,
    :root[data-theme="dark"] .theme-control select,
    :root[data-theme="dark"] #search-button {
      border-color: #5f6368; background-color: #202124; color: #e8eaed;
    }
    :root[data-theme="dark"] .search-panel:has(> #location-status.visible, > #status.visible, > #service-details:not([hidden]), > #routes:not(:empty)) {
      background: #202124;
    }
    :root[data-theme="dark"] .route-card.shortest {
      border-color: #81c995; background: #1b2b20;
    }
    :root[data-theme="dark"] .service-details-action.assistance {
      border-color: #f28b82; color: #f28b82;
    }
    :root[data-theme="dark"] .service-details-action:disabled {
      background: #303134; color: #9aa0a6;
    }
    :root[data-theme="dark"] #account-identity,
    :root[data-theme="dark"] .account-history-heading h3,
    :root[data-theme="dark"] #history-logged-out,
    :root[data-theme="dark"] #activity-history li { color: #e8eaed; }
    :root[data-theme="dark"] .account-content label,
    :root[data-theme="dark"] #account-status,
    :root[data-theme="dark"] #history-status,
    :root[data-theme="dark"] .activity-time { color: #bdc1c6; }
    :root[data-theme="dark"] .account-content input,
    :root[data-theme="dark"] .account-buttons button,
    :root[data-theme="dark"] #account-open-form,
    :root[data-theme="dark"] #clear-history {
      border-color: #5f6368; background: #202124; color: #8ab4f8;
    }
    :root[data-theme="dark"] .account-content input { color: #e8eaed; }
    :root[data-theme="dark"] #destination,
    :root[data-theme="dark"] .route-name,
    :root[data-theme="dark"] .route-directions li,
    :root[data-theme="dark"] .service-details-row,
    :root[data-theme="dark"] .service-details-title {
      color: #e8eaed;
    }
    :root[data-theme="dark"] #destination::placeholder,
    :root[data-theme="dark"] #status,
    :root[data-theme="dark"] #location-status,
    :root[data-theme="dark"] .route-meta,
    :root[data-theme="dark"] .step-distance,
    :root[data-theme="dark"] .no-directions,
    :root[data-theme="dark"] .map-control-heading,
    :root[data-theme="dark"] .service-details-category,
    :root[data-theme="dark"] .service-details-notice,
    :root[data-theme="dark"] .theme-control {
      color: #bdc1c6;
    }
    :root[data-theme="dark"] .map-control-row { color: #e8eaed; }
    :root[data-theme="dark"] .map-control-section + .map-control-section,
    :root[data-theme="dark"] .route-directions {
      border-color: #5f6368;
    }
    :root[data-theme="dark"] .map-category-expand { color: #e8eaed; }
    :root[data-theme="dark"] .map-category-expand:hover,
    :root[data-theme="dark"] .map-tool-button:hover,
    :root[data-theme="dark"] #search-button:hover,
    :root[data-theme="dark"] .service-details-action:hover {
      background: #303134;
    }
    :root[data-theme="dark"] .service-details-hours.open { color: #81c995; }
    :root[data-theme="dark"] .service-details-hours.closed { color: #f28b82; }
    :root[data-theme="dark"] .service-details-hours.unknown { color: #bdc1c6; }
    :root[data-theme="dark"] .service-details-row a { color: #8ab4f8; }
    :root[data-theme="dark"] .service-name {
      color: #f1f3f4; text-shadow: 0 1px 3px #000, 0 0 5px #000;
    }
    :root[data-theme="dark"] .leaflet-control-zoom a,
    :root[data-theme="dark"] .leaflet-popup-content-wrapper,
    :root[data-theme="dark"] .leaflet-popup-tip {
      border-color: #5f6368; background: #202124; color: #e8eaed;
    }
    :root[data-theme="dark"] .leaflet-control-attribution {
      background: #202124cc; color: #bdc1c6;
    }
    :root[data-theme="dark"] .leaflet-control-attribution a { color: #8ab4f8; }
    #map.dark-street-map .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.9);
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Map"></div>
  <section class="search-panel" aria-label="Map search">
    <form id="search-form">
      <input id="destination" type="search" placeholder="Search places or coordinates" aria-label="Search places or coordinates" required>
      <button id="search-button" type="submit" aria-label="Search">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"></circle>
          <path d="m16 16 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </button>
    </form>
    <div id="location-status" role="status" aria-live="polite">Finding device location...</div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="service-details" aria-label="Selected service details" aria-live="polite" hidden></div>
    <div id="routes" aria-label="Available routes"></div>
  </section>
  <div id="account-panel" class="account-panel">
    <button id="account-toggle" class="map-tool-button" type="button" aria-label="Account" title="Account" aria-expanded="false" aria-controls="account-content">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21a8 8 0 0 1 16 0"></path>
      </svg>
    </button>
    <div id="account-content" class="account-content" hidden>
      <div id="account-status" role="status" aria-live="polite"></div>
      <div id="account-logged-out">
        <button id="account-open-form" type="button">Sign in / create account</button>
        <form id="account-form" hidden>
          <label id="signup-name-row" hidden>
            Display name
            <input id="signup-name" type="text" autocomplete="name" maxlength="100">
          </label>
          <label>
            Email
            <input id="account-email" type="email" autocomplete="email" required>
          </label>
          <label>
            Password
            <input id="account-password" type="password" autocomplete="current-password" minlength="8" required>
          </label>
          <div class="account-buttons">
            <button id="account-submit" type="submit">Sign in</button>
            <button id="account-mode" type="button">Create account</button>
            <button id="account-cancel" type="button">Cancel</button>
          </div>
        </form>
      </div>
      <div id="account-logged-in" hidden>
        <div id="account-identity"></div>
        <label>
          Display name
          <input id="profile-name" type="text" autocomplete="name" maxlength="100">
        </label>
        <div class="account-buttons">
          <button id="save-profile" type="button">Save profile</button>
          <button id="account-sign-out" type="button">Sign out</button>
        </div>
      </div>
    </div>
  </div>
  <div id="history-panel" class="history-panel">
    <button id="history-toggle" class="map-tool-button" type="button" aria-label="History" title="History" aria-expanded="false" aria-controls="history-content">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M3 11a9 9 0 1 1 2.64 6.36L3 15.5"></path>
        <path d="M3 7v5h5"></path>
        <path d="M12 7v5l3 2"></path>
      </svg>
    </button>
    <div id="history-content" class="history-content" hidden>
      <div id="history-status" role="status" aria-live="polite"></div>
      <div id="history-logged-out">Sign in with the account icon to view your saved activity.</div>
      <div id="history-logged-in" hidden>
        <div class="account-history-heading">
          <h3>Saved activity</h3>
          <button id="clear-history" type="button">Clear history</button>
        </div>
        <ol id="activity-history" aria-label="Saved search and map history"></ol>
      </div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/opening-hours/opening_hours+deps.min.js"></script>
  <script src="vendor/supabase/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script>
    const themeStorageKey = 'osm-map-theme';
    const systemThemePreference = window.matchMedia('(prefers-color-scheme: dark)');
    let selectedTheme = 'system';
    function applyTheme() {
      document.documentElement.dataset.theme = selectedTheme === 'system'
        ? (systemThemePreference.matches ? 'dark' : 'light')
        : selectedTheme;
      setBaseLayer('Street Map');
    }

    function handleSystemThemeChange() {
      if (selectedTheme === 'system') {
        applyTheme();
        recordActivity('map_style', { style: 'Street Map', theme: 'system' });
      }
    }

    function initializeThemeSelector() {
      const themeSelect = document.getElementById('theme-select');
      try {
        const savedTheme = window.localStorage.getItem(themeStorageKey);
        if (savedTheme === 'light' || savedTheme === 'dark' || savedTheme === 'system') {
          selectedTheme = savedTheme;
        }
      } catch (error) {
        console.warn('Could not load the saved theme preference:', error);
      }
      themeSelect.value = selectedTheme;
      themeSelect.addEventListener('change', function () {
        selectedTheme = themeSelect.value;
        applyTheme();
        recordActivity('map_style', { style: 'Street Map', theme: selectedTheme });
        try {
          window.localStorage.setItem(themeStorageKey, selectedTheme);
        } catch (error) {
          console.warn('Could not save the theme preference:', error);
        }
      });
      if (systemThemePreference.addEventListener) {
        systemThemePreference.addEventListener('change', handleSystemThemeChange);
      } else if (systemThemePreference.addListener) {
        systemThemePreference.addListener(handleSystemThemeChange);
      }
      applyTheme();
    }

    const esriTrafficApiKey = ''; // Set locally to enable the Esri live traffic overlay.
    const map = L.map('map', { zoomControl: false }).setView([10.6896476, 122.4824483], 14);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    const initialCenter = [map.getCenter().lng, map.getCenter().lat];
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'
    }).addTo(map);
    const streetLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    });
    const terrainLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxNativeZoom: 17,
      maxZoom: 19,

      const payload = entry.payload || {};
      if (entry.activity_type === 'search') return 'Search: ' + (payload.query || 'Unknown query');
      if (entry.activity_type === 'map_style') {
        return 'Map style: ' + (payload.style || 'Unknown') +
          (payload.theme ? ' (' + payload.theme + ' theme)' : '');
      }
      if (entry.activity_type === 'overlay') {
        return 'Overlay: ' + (payload.label || 'Unknown') + (payload.enabled ? ' on' : ' off');
      }
      if (entry.activity_type === 'selected_place') {
        return 'Place: ' + (payload.name || 'Unknown') +
          (payload.category ? ' · ' + payload.category : '');
      }
      return 'Map activity';

    function renderActivityHistory(entries) {

        activityHistory.appendChild(emptyItem);
        return;
      }
      entries.forEach(function (entry) {
        const item = document.createElement('li');
        item.appendChild(document.createTextNode(getActivityLabel(entry)));
        const timestamp = new Date(entry.created_at);
        if (!Number.isNaN(timestamp.getTime())) {
          const time = document.createElement('span');
          time.className = 'activity-time';
          time.textContent = timestamp.toLocaleString();
          item.appendChild(time);
        }
        activityHistory.appendChild(item);

    async function loadActivityHistory(userId) {
      if (!supabaseClient || !currentUser || currentUser.id !== userId) return;
      try {
        const result = await supabaseClient
          .from('map_activity')
          .select('activity_type,payload,created_at')
          .eq('user_id', userId)
          .order('created_at', { ascending: false })
          .limit(100);
        if (result.error) throw result.error;
        if (currentUser && currentUser.id === userId) renderActivityHistory(result.data || []);
      } catch (error) {
        console.error('Could not load saved map activity:', error);
        setAccountStatus('Could not load saved history: ' + error.message);
      }
    }

    async function loadAccountData(userId) {
      if (!supabaseClient || !currentUser || currentUser.id !== userId) return;
      try {
        const result = await supabaseClient
          .from('user_profiles')
          .select('display_name')
          .eq('user_id', userId)
          .maybeSingle();
        if (result.error) throw result.error;
        if (!currentUser || currentUser.id !== userId) return;
        profileNameInput.value = result.data
          ? result.data.display_name
          : currentUser.user_metadata && currentUser.user_metadata.display_name || '';
        await loadActivityHistory(userId);
      } catch (error) {
        console.error('Could not load the account profile:', error);
        setAccountStatus('Could not load profile details: ' + error.message);

    function getOpeningStatus(openingHoursValue, coordinates) {
      const schedule = openingHoursValue ? openingHoursValue.trim() : '';
      if (!schedule) {
        return { status: 'Opening hours not provided', state: 'unknown', schedule: '' };
      }
      if (schedule === '24/7') {
        return { status: 'Open 24/7', state: 'open', schedule: schedule };
      }
      if (typeof window.opening_hours !== 'function') {
        return { status: 'Current status unavailable', state: 'unknown', schedule: schedule };
      }

      try {
        const hours = new window.opening_hours(schedule, {
          lat: coordinates[1],
          lon: coordinates[0]
        }, { tag_key: 'opening_hours' });
        if (hours.getUnknown()) {
          return { status: 'Hours status unknown', state: 'unknown', schedule: schedule };
        }

        const isOpen = hours.getState();
        const nextChange = hours.getNextChange();
        if (!nextChange) {
          return {
            status: isOpen ? 'Open 24/7' : 'Closed',
            state: isOpen ? 'open' : 'closed',
            schedule: schedule
          };
        }
        const now = new Date();
        const timeOptions = { hour: 'numeric', minute: '2-digit' };
        if (nextChange.toDateString() !== now.toDateString()) timeOptions.weekday = 'short';
        const nextChangeTime = nextChange.toLocaleTimeString([], timeOptions);
        return {
          status: (isOpen ? 'Open now · Closes ' : 'Closed now · Opens ') + nextChangeTime,
          state: isOpen ? 'open' : 'closed',
          schedule: schedule
        };
      } catch (error) {
        console.warn('Could not interpret opening hours:', schedule, error);
        return { status: 'Hours status unknown', state: 'unknown', schedule: schedule };
      }
    }

    }

    function getSocialDetails(tags) {
      const socialLabels = {
        facebook: 'Facebook',
        instagram: 'Instagram',
        x: 'X / Twitter',
        twitter: 'X / Twitter',
        youtube: 'YouTube',
        tiktok: 'TikTok',
        linkedin: 'LinkedIn',
        telegram: 'Telegram',
        vk: 'VK',
        pinterest: 'Pinterest',
        snapchat: 'Snapchat',
        whatsapp: 'WhatsApp',
        bluesky: 'Bluesky',
        threads: 'Threads',
        mastodon: 'Mastodon',
        reddit: 'Reddit',
        discord: 'Discord',
        flickr: 'Flickr',
        wechat: 'WeChat',
        weibo: 'Weibo',
        qq: 'QQ',
        line: 'LINE',
        signal: 'Signal',
        twitch: 'Twitch',
        github: 'GitHub',
        medium: 'Medium',
        tumblr: 'Tumblr',
        vimeo: 'Vimeo',
        soundcloud: 'SoundCloud',
        skype: 'Skype',
        xing: 'Xing',
        diaspora: 'Diaspora',
        odnoklassniki: 'Odnoklassniki'
      };
      const nonSocialContactFields = new Set([
        'address', 'country_code', 'email', 'fax', 'generic', 'hours', 'language',
        'mobile', 'opening_hours', 'person', 'phone', 'ref', 'sms', 'url', 'website'
      ]);
      const knownPlatforms = new Set(Object.keys(socialLabels));
      const entries = new Map();

      Object.keys(tags).forEach(function (key) {
        const hasContactPrefix = key.toLowerCase().startsWith('contact:');
        const platformKey = (hasContactPrefix ? key.slice(8) : key).toLowerCase();
        const isNonSocialContact = Array.from(nonSocialContactFields).some(function (field) {
          return platformKey === field || platformKey.startsWith(field + ':');
        });
        if (isNonSocialContact || (!hasContactPrefix && !knownPlatforms.has(platformKey))) return;

        const value = String(tags[key] || '').trim();
        if (!value) return;
        const platform = platformKey === 'twitter' ? 'x' : platformKey;
        const priority = (hasContactPrefix ? 2 : 0) + (platformKey === 'x' ? 1 : 0);
        const previous = entries.get(platform);
        if (previous && previous.priority >= priority) return;

        const label = socialLabels[platform] ||
          platform.replace(/[_-]+/g, ' ').replace(/\b\w/g, function (letter) { return letter.toUpperCase(); });
        entries.set(platform, { label: label, value: value, priority: priority });
      });

      return Array.from(entries.entries())
        .sort(function (left, right) { return left[1].label.localeCompare(right[1].label); })
        .map(function (entry) {
          return [entry[1].label, entry[1].value, 'social', entry[0]];
        });
    }

    function getSocialProfileUrl(value, platform) {
      if (!value) return '';
      const rawValue = String(value).trim();
      const urlValue = /^https?:\/\//i.test(rawValue)
        ? rawValue
        : /^[\w.-]+\.[a-z]{2,}(?:\/|$)/i.test(rawValue) ? 'https://' + rawValue : '';
      if (urlValue) {
        try {
          const url = new URL(urlValue);
          return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : '';
        } catch (error) {
          return '';
        }
      }

      if (platform === 'whatsapp') {
        const number = normalizePhoneNumber(rawValue).replace(/[^0-9]/g, '');
        return number ? 'https://wa.me/' + number : '';
      }

      const profileBases = {
        facebook: 'https://www.facebook.com/',
        instagram: 'https://www.instagram.com/',
        x: 'https://x.com/',
        youtube: 'https://www.youtube.com/',
        tiktok: 'https://www.tiktok.com/@',
        linkedin: 'https://www.linkedin.com/in/',
        telegram: 'https://t.me/',
        vk: 'https://vk.com/',
        pinterest: 'https://www.pinterest.com/',
        snapchat: 'https://www.snapchat.com/add/',
        bluesky: 'https://bsky.app/profile/',
        threads: 'https://www.threads.net/@',
        reddit: 'https://www.reddit.com/user/',
        flickr: 'https://www.flickr.com/people/',
        twitch: 'https://www.twitch.tv/',
        github: 'https://github.com/',
        medium: 'https://medium.com/@',
        vimeo: 'https://vimeo.com/',
        soundcloud: 'https://soundcloud.com/',
        weibo: 'https://weibo.com/'
      };
      const handle = rawValue.replace(/^@/, '');
      return profileBases[platform] && handle
        ? profileBases[platform] + encodeURIComponent(handle)
        : '';
    }

    function showServiceDetails(name, categoryLabel, details, color, notice, actions) {
      serviceDetails.replaceChildren();
      serviceDetails.style.setProperty('--service-color', color);

      const heading = document.createElement('div');
      heading.className = 'service-details-heading';

      serviceDetails.appendChild(category);

      const actionBar = document.createElement('div');
      actionBar.className = 'service-details-actions';
      const addAction = function (label, href, onClick, className) {
        const action = href ? document.createElement('a') : document.createElement('button');
        action.className = 'service-details-action' + (className ? ' ' + className : '');
        action.textContent = label;
        if (href) {
          action.href = href;
        } else {
          action.type = 'button';
          action.addEventListener('click', onClick);
        }
        actionBar.appendChild(action);
      };
      const addContactAction = function (label, scheme, number) {
        if (number) {
          addAction(label, scheme + number);
          return;
        }
        const action = document.createElement('button');
        action.type = 'button';
        action.className = 'service-details-action';
        action.textContent = label;
        action.disabled = true;
        action.title = 'No phone number is available for this place.';
        actionBar.appendChild(action);
      };
      addContactAction('Call', 'tel:', actions && actions.callNumber);
      addContactAction('Message', 'sms:', actions && actions.messageNumber);
      if (actions && actions.onNeedAssistance) {
        addAction('Need assistance', '', actions.onNeedAssistance, 'assistance');
      }
      serviceDetails.appendChild(actionBar);

      details.forEach(function (detail) {
        if (!detail[1]) return;
        const row = document.createElement('div');
        row.className = 'service-details-row';
        const label = document.createElement('strong');
        label.textContent = detail[0] + ': ';
        row.appendChild(label);

        if (detail[2] === 'status') {
          label.classList.add('service-details-hours', detail[3]);
          const value = document.createElement('span');
          value.className = 'service-details-hours ' + detail[3];
          value.textContent = detail[1];
          row.appendChild(value);
        } else if (detail[2] === 'phone' || detail[2] === 'email' ||
          detail[2] === 'website' || detail[2] === 'social') {
          const link = document.createElement('a');
          link.textContent = detail[1];
          if (detail[2] === 'phone') {
            link.href = 'tel:' + detail[1].replace(/[^\d+*#;]/g, '');
          } else if (detail[2] === 'email') {
            link.href = 'mailto:' + encodeURIComponent(detail[1]);
          } else {
            try {
              const socialUrl = detail[2] === 'social'
                ? getSocialProfileUrl(detail[1], detail[3])
                : /^https?:\/\//i.test(detail[1]) ? detail[1] : 'https://' + detail[1];
              if (!socialUrl) throw new Error('No safe social profile URL could be created.');
              const website = new URL(socialUrl);
              if (website.protocol !== 'http:' && website.protocol !== 'https:') throw new Error('Unsupported website protocol.');
              link.href = website.href;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
            } catch (error) {
              row.appendChild(document.createTextNode(detail[1]));
              serviceDetails.appendChild(row);
              return;
            }
          }
          row.appendChild(link);
        } else {
          row.appendChild(document.createTextNode(detail[1]));
        }
        serviceDetails.appendChild(row);
      });

      if (notice) {
        const noticeRow = document.createElement('div');
        noticeRow.className = 'service-details-notice';
        noticeRow.textContent = notice;
        serviceDetails.appendChild(noticeRow);
      }
      serviceDetails.hidden = false;
    }

    async function loadOpenStreetMapDetails(
      objectType, objectId, tags, name, categoryLabel, getDetails, getActions, color, requestId
    ) {
      const controller = new AbortController();
      const timeoutId = setTimeout(function () { controller.abort(); }, 12000);
      try {
        const response = await fetch(
          'https://api.openstreetmap.org/api/0.6/' + objectType + '/' + encodeURIComponent(objectId) + '.json',
          { signal: controller.signal }
        );
        if (!response.ok) throw new Error('OpenStreetMap returned HTTP ' + response.status + '.');
        const data = await response.json();
        const element = Array.isArray(data.elements) && data.elements.find(function (item) {
          return item.type === objectType && String(item.id) === String(objectId);
        });
        if (!element || !element.tags) throw new Error('No detailed tags were found for this map feature.');
        Object.assign(tags, element.tags);
        if (requestId !== serviceDetailsRequestId || !isSidebarExpanded) return;
        showServiceDetails(name, categoryLabel, getDetails(), color, '', getActions());
      } catch (error) {
        if (requestId !== serviceDetailsRequestId || !isSidebarExpanded) return;
        console.warn('Could not load additional OpenStreetMap details:', error);
        showServiceDetails(
          name,
          categoryLabel,
          getDetails(),
          color,
          'Could not load additional OpenStreetMap data. Showing available details.',
          getActions()
        );
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function parseCoordinates(value) {
      const match = value.trim().match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
      if (!match) return null;
      const lat = Number(match[1]);
      const lon = Number(match[2]);
      if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
        throw new Error('Coordinates must be valid latitude, longitude values.');
      }
      return [lon, lat];
    }

    async function findLocation(value) {
      const coordinates = parseCoordinates(value);
      if (coordinates) return coordinates;
      const response = await fetch('https://photon.komoot.io/api/?limit=1&q=' + encodeURIComponent(value));
      if (!response.ok) throw new Error('Location search failed. Please try again.');
      const data = await response.json();
      const feature = data.features && data.features[0];
      if (!feature) throw new Error('Could not find "' + value + '". Try a more specific location.');
      return feature.geometry.coordinates;
    }

    function formatDistance(meters) {
      return meters < 1000 ? Math.round(meters) + ' m' : (meters / 1000).toFixed(1) + ' km';
    }

    function formatDuration(seconds) {
      const minutes = Math.round(seconds / 60);
      if (minutes < 60) return minutes + ' min';
      const hours = Math.floor(minutes / 60);
      const remainingMinutes = minutes % 60;
      return remainingMinutes ? hours + ' hr ' + remainingMinutes + ' min' : hours + ' hr';
    }

    function formatInstruction(step) {
      const maneuver = step.maneuver || {};
      const modifier = maneuver.modifier ? maneuver.modifier.replace(/_/g, ' ') : '';
      const roadName = step.name || step.ref;
      const road = roadName ? ' onto ' + roadName : '';
      const direction = modifier ? ' ' + modifier : '';

      switch (maneuver.type) {
        case 'depart':
          return 'Start' + (roadName ? ' on ' + roadName : '');
        case 'arrive':
          return 'Arrive at your destination';
        case 'turn':
          return 'Turn' + (direction || ' ahead') + road;
        case 'continue':
          return 'Continue' + (direction || ' straight') + road;
        case 'new name':
          return 'Continue' + road;
        case 'fork':
          return 'At the fork, keep' + (direction || ' straight') + road;
        case 'merge':
          return 'Merge' + direction + road;
        case 'on ramp':
          return 'Take the ramp' + direction + road;
        case 'off ramp':
          return 'Take the exit' + direction + road;
        case 'end of road':
          return 'At the end of the road, turn' + (direction || ' ahead') + road;
        case 'roundabout':
        case 'rotary':
          return 'At the roundabout, take exit ' + (maneuver.exit || 'as indicated') + road;
        case 'exit roundabout':
          return 'Exit the roundabout' + road;
        case 'notification':
          return roadName ? 'Continue on ' + roadName : 'Continue';
        default:
          return (maneuver.type || 'Continue').replace(/_/g, ' ') + direction + road;
      }
    }

    function addRouteCard(route, index, layer) {
      const card = document.createElement('details');
      card.className = 'route-card' + (index === 0 ? ' shortest selected' : '');

      const summary = document.createElement('summary');
      const title = document.createElement('span');
      title.className = 'route-name';
      title.textContent = index === 0 ? 'Shortest route' : 'Alternative route ' + (index + 1);
      const metadata = document.createElement('span');
      metadata.className = 'route-meta';
      metadata.textContent = formatDistance(route.distance) + ' · ' + formatDuration(route.duration);
      summary.append(title, metadata);
      card.appendChild(summary);

      const directions = document.createElement('div');
      directions.className = 'route-directions';
      const steps = [];
      (route.legs || []).forEach(function (leg) {
        (leg.steps || []).forEach(function (step) { steps.push(step); });
      });

      if (steps.length) {
        const list = document.createElement('ol');
        steps.forEach(function (step) {
          const item = document.createElement('li');
          const instruction = document.createElement('span');
          instruction.textContent = formatInstruction(step);
          const distance = document.createElement('span');
          distance.className = 'step-distance';
          distance.textContent = formatDistance(step.distance);
          item.append(instruction, distance);
          list.appendChild(item);
        });
        directions.appendChild(list);
      } else {
        const message = document.createElement('p');
        message.className = 'no-directions';
        message.textContent = 'Turn-by-turn directions are unavailable for this route.';
        directions.appendChild(message);
      }
      card.appendChild(directions);
      summary.addEventListener('click', function () {
        routesElement.querySelectorAll('.route-card').forEach(function (otherCard) {
          otherCard.classList.remove('selected');
        });
        card.classList.add('selected');
        map.fitBounds(layer.getBounds(), {
          paddingTopLeft: [32, 96],
          paddingBottomRight: [32, 32]
        });
      });
      routesElement.appendChild(card);
    }

    async function loadServices() {
      const requestId = ++serviceRequestId;
      if (serviceRequestController) serviceRequestController.abort();
      if (map.getZoom() < 12) {
        serviceMarkerGroups.forEach(function (group) { group.clearLayers(); });
        if (hasUserInteracted && !isSearching && !/route/i.test(status.textContent)) {
          setStatus('Zoom in to view nearby health, emergency, and other services.');
        }
        return;
      }

      const shouldUpdateServiceStatus = hasUserInteracted && !isSearching &&
        (!status.classList.contains('visible') ||
         /mapped services|Loading nearby services|Zoom in to view nearby/.test(status.textContent));
      if (shouldUpdateServiceStatus) setStatus('Loading nearby services...');
      const bounds = map.getBounds();
      const bbox = [
        bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth()
      ].map(function (coordinate) { return coordinate.toFixed(5); }).join(',');
      const params = new URLSearchParams({
        bbox: bbox,
        limit: '100',
        lang: 'en'
      });
      params.set(
        'include',
        (isAssistanceSearch ? emergencyServiceFilters : serviceCategoryFilters).join(',')
      );
      const controller = new AbortController();
      const timeoutId = setTimeout(function () { controller.abort(); }, 15000);
      serviceRequestController = controller;

      try {
        const response = await fetch('https://photon.komoot.io/api/?' + params.toString(), {
          signal: controller.signal
        });
        if (!response.ok) throw new Error('Service search returned HTTP ' + response.status + '.');
        const data = await response.json();
        if (requestId !== serviceRequestId) return;
        if (!Array.isArray(data.features)) throw new Error('Service search returned invalid data.');

        serviceMarkerGroups.forEach(function (group) { group.clearLayers(); });
        let addedCount = 0;
        let emergencyCount = 0;
        data.features.forEach(function (feature) {
          const properties = feature.properties || {};
          const coordinates = feature.geometry && feature.geometry.coordinates;
          if (!Array.isArray(coordinates) || coordinates.length < 2) return;
          const longitude = coordinates[0];
          const latitude = coordinates[1];
          if (typeof latitude !== 'number' || typeof longitude !== 'number') return;

          const tags = properties.extra && typeof properties.extra === 'object' ?
            Object.assign({}, properties.extra) : {};
          if (properties.osm_key && properties.osm_value) {
            tags[properties.osm_key] = properties.osm_value;
          }
          if (properties.name) tags.name = properties.name;
          if (properties.housenumber) tags['addr:housenumber'] = properties.housenumber;
          if (properties.street) tags['addr:street'] = properties.street;
          if (properties.city) tags['addr:city'] = properties.city;

          const categoryValue = tags.healthcare || tags.amenity || tags.emergency || tags.shop ||
            tags.office ||
            properties.osm_value || 'service';
          const category = categoryValue.replace(/_/g, ' ');
          const categoryLabel = category.replace(/\b\w/g, function (letter) {
            return letter.toUpperCase();
          });
          const name = tags.name || categoryLabel;
          const emergencyValue = tags.emergency && tags.emergency !== 'yes' && tags.emergency !== 'no'
            ? tags.emergency : tags.office && serviceCategoryGroupByValue[tags.office] ? tags.office : '';
          const healthValue = tags.healthcare ||
            (tags.shop && serviceCategoryGroupByValue[tags.shop] &&
              serviceCategoryGroupByValue[tags.shop].indexOf('health') === 0 ? tags.shop : '') ||
            (tags.amenity && serviceCategoryGroupByValue[tags.amenity] &&
              serviceCategoryGroupByValue[tags.amenity].indexOf('health') === 0 ? tags.amenity : '');
          const serviceGroupName = serviceCategoryGroupByValue[emergencyValue] ||
            serviceCategoryGroupByValue[tags.amenity] ||
            serviceCategoryGroupByValue[healthValue] ||
            (emergencyValue ? 'emergencyDisaster' : tags.healthcare ? 'healthOther' : 'other');
          const isEmergency = serviceGroupName.indexOf('emergency') === 0;
          const isHealth = serviceGroupName.indexOf('health') === 0;
          const color = isEmergency ? '#d93025' : isHealth ? '#188038' : '#1a73e8';
          const markerGroup = serviceGroups[serviceGroupName];
          const pin = document.createElement('div');
          pin.className = 'service-pin';
          pin.style.setProperty('--service-color', color);
          const badge = document.createElement('span');
          badge.className = 'service-badge';
          badge.style.backgroundColor = color;
          badge.textContent = serviceSymbols[categoryValue] ||
            (isEmergency ? '!' : isHealth ? '✚' : '•');
          const label = document.createElement('span');
          label.className = 'service-name';
          label.textContent = tags.name ? name + ' · ' + category : name;
          const labelWidth = Math.min(210, Math.max(50, label.textContent.length * 7));
          pin.append(badge, label);

          const icon = L.divIcon({
            className: 'service-div-icon',
            html: pin,
            iconSize: [labelWidth + 30, 28],
            iconAnchor: [11, 14]
          });
          const marker = L.marker([latitude, longitude], {
            icon: icon,
            title: name + ' (' + category + ')',
            alt: name,
            bubblingMouseEvents: false
          }).addTo(markerGroup);

          const osmObjectTypes = { N: 'node', W: 'way', R: 'relation' };
          const osmObjectType = osmObjectTypes[properties.osm_type] || '';
          const osmObjectId = String(properties.osm_id || '');
          const getActions = function () {
            const phoneNumber = normalizePhoneNumber(tags.phone) ||
              normalizePhoneNumber(tags['contact:phone']) ||
              normalizePhoneNumber(tags.mobile) ||
              normalizePhoneNumber(tags['contact:mobile']);
            const mobileNumber = normalizePhoneNumber(tags['contact:mobile']) ||
              normalizePhoneNumber(tags.mobile);
            return {
              callNumber: phoneNumber,
              messageNumber: mobileNumber || phoneNumber,
              onNeedAssistance: showNearbyEmergencyServices
            };
          };
          const getDetails = function () {
            const openingStatus = getOpeningStatus(tags.opening_hours, [longitude, latitude]);
            const missingInfo = 'Not listed';
            const address = tags['addr:full'] || [
              tags['addr:housenumber'],
              tags['addr:street'] || properties.street,
              tags['addr:city'] || properties.city,
              properties.postcode
            ].filter(Boolean).join(' ');
            const phone = tags.phone || tags['contact:phone'];
            const mobile = tags['contact:mobile'] || tags.mobile;
            const email = tags.email || tags['contact:email'];
            const website = tags.website || tags['contact:website'] || tags.url;
            return [
              ['Address', address || missingInfo],
              ['Phone', phone || missingInfo, phone ? 'phone' : ''],
              ['Mobile', mobile || missingInfo, mobile ? 'phone' : ''],
              ['Email', email || missingInfo, email ? 'email' : ''],
              ['Website', website || missingInfo, website ? 'website' : ''],
              ['Fax', tags.fax || tags['contact:fax']],
              ['Brand', tags.brand],
              ['Hours', openingStatus.status, 'status', openingStatus.state],
              ['Opening schedule', openingStatus.schedule],
              ['Operator', tags.operator],
              ['Description', tags['description:en'] || tags.description],
              ['Services', tags['healthcare:speciality'] || tags.healthcare_speciality],
              ['Wheelchair access', tags.wheelchair],
              ['Payment', [
                tags['payment:cash'] ? 'Cash: ' + tags['payment:cash'] : '',
                tags['payment:cards'] ? 'Cards: ' + tags['payment:cards'] : ''
              ].filter(Boolean).join('; ')],
            ].concat(getSocialDetails(tags));
          };
          const selectService = function () {
            document.querySelectorAll('.service-pin.expanded').forEach(function (expandedPin) {
              expandedPin.classList.remove('expanded');
            });
            pin.classList.add('expanded');
            selectedServiceCoordinates = [longitude, latitude];
            expandSidebar();
            const selectedDetails = getDetails();
            recordActivity('selected_place', {
              name: name,
              category: categoryLabel,
              osmType: osmObjectType || null,
              osmId: osmObjectId || null,
              coordinates: [longitude, latitude],
              details: selectedDetails
                .filter(function (detail) { return detail[1]; })
                .map(function (detail) { return { label: detail[0], value: detail[1] }; })
            });
            const detailsRequestId = ++serviceDetailsRequestId;
            showServiceDetails(
              name,
              categoryLabel,
              selectedDetails,
              color,
              osmObjectType && /^\d+$/.test(osmObjectId)
                ? 'Loading additional information from OpenStreetMap...'
                : '',
              getActions()
            );
            if (osmObjectType && /^\d+$/.test(osmObjectId)) {
              loadOpenStreetMapDetails(
                osmObjectType,
                osmObjectId,
                tags,
                name,
                categoryLabel,
                getDetails,
                getActions,
                color,
                detailsRequestId
              );
            }
            destinationInput.value = name;
            searchDestination(name, [longitude, latitude]);
          };
          label.addEventListener('click', function (event) {
            L.DomEvent.stopPropagation(event);
            selectService();
          });
          marker.on('click', selectService);
          addedCount += 1;
          if (isEmergency) emergencyCount += 1;
        });

        if (status.textContent === 'Loading nearby services...') {
          if (isAssistanceSearch) {
            setStatus(emergencyCount
              ? emergencyCount + ' mapped emergency services found nearby. Select a pin for contact details and directions. For immediate danger, contact local emergency services.'
              : 'No mapped emergency services found nearby. For immediate danger, contact local emergency services.');
            isAssistanceSearch = false;
          } else {
            setStatus(addedCount
              ? addedCount + ' mapped services from OpenStreetMap. Select a pin for details and routes.'
              : 'No mapped health, emergency, or other services in this map area.');
          }
        }
      } catch (error) {
        if (requestId !== serviceRequestId) return;
        console.error('Could not load map services:', error);
        if (hasUserInteracted && !isSearching) {
          setStatus('Could not load service locations. Please try again later.');
        }
        isAssistanceSearch = false;
      } finally {
        clearTimeout(timeoutId);
        if (serviceRequestController === controller) serviceRequestController = null;
      }
    }

    async function searchDestination(destination, knownCoordinates) {
      if (isSearching) return;
      markUserInteracted();
      expandSidebar();
      recordActivity('search', { query: destination });
      isSearching = true;
      searchButton.disabled = true;
      setStatus('Searching...');
      routeLayers.clearLayers();
      routesElement.replaceChildren();
      if (destinationMarker) {
        map.removeLayer(destinationMarker);
        destinationMarker = null;
      }

      try {
        const end = knownCoordinates || await findLocation(destination);
        const popupContent = document.createElement('span');
        popupContent.textContent = 'Destination: ' + destination;
        destinationMarker = L.marker([end[1], end[0]]).addTo(map).bindPopup(popupContent);
        const start = routeOrigin;
        const coordinates = [start, end].map(function (point) { return point.join(','); }).join(';');
        const response = await fetch(
          'https://router.project-osrm.org/route/v1/driving/' + coordinates +
          '?alternatives=3&steps=true&overview=full&geometries=geojson'
        );
        if (!response.ok) throw new Error('Route service is unavailable. Please try again.');
        const data = await response.json();
        if (data.code !== 'Ok' || !data.routes || data.routes.length === 0) {
          throw new Error('No driving routes were found for those locations.');
        }

        const routes = data.routes.slice().sort(function (a, b) { return a.distance - b.distance; });
        routes.forEach(function (route, index) {
          const color = ['#1684ff', '#ffb300', '#e04f9b'][index % 3];
          const layer = L.geoJSON(route.geometry, {
            style: {
              color: color,
              weight: index === 0 ? 8 : 5,
              opacity: index === 0 ? 0.98 : 0.85
            },
            bubblingMouseEvents: false
          }).addTo(routeLayers);
          addRouteCard(route, index, layer);
        });

        map.fitBounds(routeLayers.getBounds(), {
          paddingTopLeft: [32, 96],
          paddingBottomRight: [32, 32]
        });
        setStatus(routes.length + ' route' + (routes.length === 1 ? '' : 's') + ' found. Shortest route highlighted.');
      } catch (error) {
        setStatus(error.message || 'Could not find routes. Please try again.');
      } finally {
        searchButton.disabled = false;
        isSearching = false;
      }
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      const destination = destinationInput.value.trim();
      if (destination) {
        markUserInteracted();
        searchDestination(destination);
      }
    });

    map.on('contextmenu', function (event) {
      event.originalEvent.preventDefault();
      if (isSearching) return;
      const destination = event.latlng.lat.toFixed(6) + ', ' + event.latlng.lng.toFixed(6);
      destinationInput.value = destination;
      searchDestination(destination, [event.latlng.lng, event.latlng.lat]);
    });

    map.on('click', collapseSidebar);
    map.on('moveend', scheduleServiceRefresh);
    map.locate({
      setView: false,
      maxZoom: 16,
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 60000
    });
    initializeAccount();
    loadServices();

    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js').catch(function (error) {
          console.error('Could not register the offline app shell:', error);
        });
      });
    }
  </script>
