<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open Street Map Route Finder</title>
  <script>
    (function () {
      try {
        var lastRole = localStorage.getItem('osm-map-offline-v1:account-last-role');
        if (lastRole === 'responder') {
          window.location.replace('/responder');
          return;
        }
      } catch (e) {}
      window.location.replace('/map');
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/map">
  </noscript>
</head>
<body>
  <p>Loading Map Route Finder... If you are not redirected automatically, <a href="/map">click here for Map</a> or <a href="/responder">here for Responder Console</a>.</p>
</body>
</html>
